name: CPI Deployment 

on:
  push:
    branches:
      - main 
    
jobs:
  deploy: 
    runs-on: ubuntu-latest 
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4   
      - name: Verify ZIP 
        run: |
          test -f iflows/CICD-DEMO.zip

      - name: Success Message
        run: echo "CICD-DEMO.zip found"
